name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Public build-time config (a VITE_* value ships in the bundle, so these
    # are repository VARIABLES, not secrets). VITE_HEDERA_NETWORK,
    # VITE_ADMIN_ACCOUNT and VITE_TREASURY_ACCOUNTS fall back to the defaults
    # in src/config.ts when unset; VITE_WALLETCONNECT_PROJECT_ID has no
    # default — without it the deployed page is read-only stats with no
    # wallet. Never put a private key or any Hedera account secret here.
    env:
      VITE_HEDERA_NETWORK: ${{ vars.VITE_HEDERA_NETWORK }}
      VITE_ADMIN_ACCOUNT: ${{ vars.VITE_ADMIN_ACCOUNT }}
      # Empty = the page only offers creating a treasury; an id = the record and
      # the new-transaction view for that account. Set in the repository's
      # Settings → Secrets and variables → Actions → Variables.
      VITE_TREASURY_ACCOUNTS: ${{ vars.VITE_TREASURY_ACCOUNTS }}
      VITE_WALLETCONNECT_PROJECT_ID: ${{ vars.VITE_WALLETCONNECT_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
